[package]
name = "liuliu-reader"
version = "0.1.0"
description = "溜溜读书 Tauri 2 应用"
authors = ["溜溜读书"]
edition = "2021"

[lib]
name = "liuliu_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
url = "2"
once_cell = "1"
parking_lot = "0.12"
html-escape = "0.2"
# 番茄官方签名 + 解密链路
sm3 = "0.4"            # SM3 国密哈希
md-5 = "0.10"          # MD5
aes = "0.8"            # AES-128
cbc = { version = "0.1", features = ["alloc", "block-padding"] }  # CBC + 填充模式
block-padding = "0.3"  # PKCS#7
base64 = "0.22"
flate2 = "1"           # zlib/gzip 解压
rand = "0.8"           # 随机 nonce
hex = "0.4"            # hex 编码
